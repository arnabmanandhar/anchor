[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anchor-rag-eval"
version = "0.5.0"
description = "A deterministic-first evaluation and tracing layer for RAG pipelines."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Arnab Manandhar" }]
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
llm = ["anthropic>=1.0"]
dashboard = ["streamlit>=1.50", "pandas>=2.0"]
examples = ["scikit-learn>=1.3"]
dev = ["pytest>=7.4", "anchor-rag-eval[llm,dashboard,examples]"]

[project.urls]
Repository = "https://github.com/arnabmanandhar/anchor"

[project.scripts]
anchor = "anchor.cli:main"

[tool.setuptools]
packages = ["anchor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

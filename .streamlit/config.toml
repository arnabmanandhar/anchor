[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f2f4f7"
textColor = "#1d1d1b"
font = "sans serif"

[client]
# Show exception types only; full messages and tracebacks go to the server
# console, never the browser. Set STREAMLIT_CLIENT_SHOW_ERROR_DETAILS=full
# locally while developing.
showErrorDetails = "type"
toolbarMode = "viewer"

[server]
enableXsrfProtection = true
maxUploadSize = 20

[browser]
gatherUsageStats = false
